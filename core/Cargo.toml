[package]
name = "funny-core"
version = "0.1.0"
edition = "2021"
description = "Library low-level FunnyBoxes (memory, math, graphics) dikompilasi ke WebAssembly"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
codegen-units = 1
strip = true
